name: Build and deploy Pokémon Party Picker

on:
  push:
    branches: [main]
    # Only redeploy when the published site can actually change. Every deploy
    # re-syncs the full multi-GB data payload to Pages (the flaky part), so
    # test-only / docs-only commits shouldn't roll those dice.
    paths:
      - "src/**"
      - "public/**"
      - "site-data/**"
      - "scripts/**"
      - "index.html"
      - "pool.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  # The daily data harvest lives in harvest.yml and dispatches this workflow
  # once its data commit lands, so a code push never waits behind it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep every deployment gated by the cheap mechanical/correctness suite.
      # Scoring-affecting paths additionally run the badge corpus in the
      # separate scoring-calibration workflow, without forcing docs-only work
      # through a subjective optimizer run.
      - name: Run fast tests
        run: npm test

      - name: Build static site
        run: npm run build:site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The site payload is large (multi-GB of usage data), and the Pages
      # file-sync phase intermittently gives up with "Deployment failed, try
      # again later" — a deploy-side flake, not a build failure. Retry once
      # before declaring the run failed.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # Observed 2026-07-06: the attempt AND an immediate retry died in the
      # same Pages backend incident ("try again later", ~90s apart). Wait out
      # the bad window before retrying.
      - name: Wait before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 300

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
