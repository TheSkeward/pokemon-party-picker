name: Build and deploy Pokémon Party Picker

on:
  push:
    branches: [main]
    # Only redeploy when the published site can actually change. Every deploy
    # re-syncs the full multi-GB data payload to Pages (the flaky part), so
    # test-only / docs-only commits shouldn't roll those dice.
    paths:
      - "src/**"
      - "public/**"
      - "site-data/**"
      - "scripts/**"
      - "index.html"
      - "pool.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  # The daily data harvest lives in harvest.yml and dispatches this workflow
  # once its data commit lands, so a code push never waits behind it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep every deployment gated by the cheap mechanical/correctness suite.
      # Scoring-affecting paths additionally run the badge corpus in the
      # separate scoring-calibration workflow, without forcing docs-only work
      # through a subjective optimizer run.
      - name: Run fast tests
        run: npm test

      # The raw monthly Smogon sources alone put the Pages artifact over its
      # 1 GB limit; the site's default mode reads only the indexes built from
      # them, and the app hides single-month mode when they are absent.
      - name: Build static site
        run: npm run build:site
        env:
          DEPLOY_EXCLUDE_DATA: sources

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-last.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The Pages file sync fails two ways, both on its side: it rejects the
      # deployment after about a minute ("try again later"), or it hangs in
      # syncing_files. A healthy sync finishes inside a minute, so each
      # attempt waits four minutes at most instead of the action's ten.
      # 2026-11-01..04: the attempt and a retry five minutes later died in
      # the same incident four times out of four, so a second retry waits
      # fifteen minutes more. 2026-11-08: both attempts hung for the full
      # ten minutes, and a fresh dispatch 27 minutes after the first attempt
      # succeeded at once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 240000

      - name: Wait before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 300

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 240000

      - name: Wait before the last Pages deploy attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 900

      - name: Last deploy attempt to GitHub Pages
        id: deployment-last
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 240000
